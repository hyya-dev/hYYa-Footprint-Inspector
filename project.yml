name: hYYaFootprintInspector
options:
  bundleIdPrefix: com.hyya
  # iOS 26 floor: owner's decision 2026-10-17. Same floor and reasoning (real Liquid Glass APIs)
  # as hYYa Encrypted Notes; see that project's project.yml.
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Apple silicon only: same convention as the sibling hYYa apps.
    ARCHS: arm64
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "20"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "8PYFWUL3ND"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  hYYaFootprintInspectorIOS:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    settings:
      base:
        PRODUCT_NAME: "hYYa Footprint Inspector"
        PRODUCT_MODULE_NAME: "FootprintInspector"
        PRODUCT_BUNDLE_IDENTIFIER: com.hyya.footprintinspector
        # The generated Info.plist is merged with App/Info.plist, which holds the permission
        # wording, the Bonjour service list and LSApplicationQueriesSchemes.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "hYYa Footprint Inspector"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Black launch screen, so opening the app doesn't flash white before the black UI.
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: LaunchBackground
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # iPhone: portrait only. iPad: all four, which Apple requires for iPad multitasking (an upload
        # with portrait-only iPad was rejected, 2026-10-17).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Native macOS app. Same bundle id as iOS, so one App Store record and one listing cover both
  # (as hYYa Encrypted Notes does). Shares the model, scanner and UI; Mac-only readers live in
  # App/Sources behind `#if os(macOS)`.
  hYYaFootprintInspectorMac:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    settings:
      base:
        PRODUCT_NAME: "hYYa Footprint Inspector"
        PRODUCT_MODULE_NAME: "FootprintInspector"
        PRODUCT_BUNDLE_IDENTIFIER: com.hyya.footprintinspector
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "hYYa Footprint Inspector"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # Export compliance: standard system encryption only (same answer as iOS).
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 hYYa"
        CODE_SIGN_ENTITLEMENTS: App/macOS/FootprintInspectorMac.entitlements
        # Sand accent for system controls the SwiftUI tint doesn't reach (sidebar, menus, alerts).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Same wording as iOS: what the permission shows, and that it stays on the device.
        INFOPLIST_KEY_NSLocationUsageDescription: "To show you what any app with location access can see about where you are. It stays on this device."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "To show you what any app with location access can see about where you are. It stays on this device."
        INFOPLIST_KEY_NSCameraUsageDescription: "To show you what any app with camera access can learn about your cameras. No photo or video is taken."
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "To show you which nearby devices any app with Bluetooth access can see, often with their owners' names. It stays on this device."
        INFOPLIST_KEY_NSContactsUsageDescription: "To show you what any app with Contacts access can learn. We only count; nothing is saved or sent."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "To show you what any app with Photos access can learn, such as the places your photos were taken. It stays on this device."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "To show you what any app with Calendar access can learn. We only count; nothing is saved or sent."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "To show you what any app with Reminders access can learn. We only count; nothing is saved or sent."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # The keychain group needs a real profile even for Debug (Xcode has no account signed in
        # here, so automatic signing can't make one). Release is signed by testflight-upload-mac.sh.
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development"
          PROVISIONING_PROFILE_SPECIFIER: "hYYa Footprint Inspector Mac Development"

  hYYaFootprintInspectorMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TestsMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hyya.footprintinspector.mactests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/hYYa Footprint Inspector.app/Contents/MacOS/hYYa Footprint Inspector"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: hYYaFootprintInspectorMac

  hYYaFootprintInspectorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hyya.footprintinspector.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/hYYa Footprint Inspector.app/hYYa Footprint Inspector"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: hYYaFootprintInspectorIOS

  # On-device UI tests: drive the app, permission prompts and Settings links on a real iPhone.
  hYYaFootprintInspectorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hyya.footprintinspector.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: hYYaFootprintInspectorIOS
    dependencies:
      - target: hYYaFootprintInspectorIOS

schemes:
  hYYa Footprint Inspector Mac:
    build:
      targets:
        hYYaFootprintInspectorMac: all
        hYYaFootprintInspectorMacTests: [test]
    test:
      targets:
        - hYYaFootprintInspectorMacTests
    run:
      config: Debug
    archive:
      config: Release

  hYYa Footprint Inspector:
    build:
      targets:
        hYYaFootprintInspectorIOS: all
        hYYaFootprintInspectorTests: [test]
    test:
      targets:
        - hYYaFootprintInspectorTests
    run:
      config: Debug
    archive:
      config: Release

  hYYa Footprint Inspector UITests:
    build:
      targets:
        hYYaFootprintInspectorIOS: all
        hYYaFootprintInspectorUITests: [test]
    test:
      config: Debug
      targets:
        - hYYaFootprintInspectorUITests
