name: Bug report
description: Something in the app doesn't work or shows something wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw. Screenshots help, but blur anything personal.
    validations:
      required: true
  - type: input
    id: ios
    attributes:
      label: iOS version
      placeholder: e.g. iOS 27.0.1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: e.g. iPhone 17 Pro
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings › Version in the app.
